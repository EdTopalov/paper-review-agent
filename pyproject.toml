[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "paper-review-agent"
version = "0.1.0"
description = "Bounded paper-reading agent and reproducible milestone evaluation"
requires-python = ">=3.11"
dependencies = ["openai>=1.93,<3", "python-dotenv>=1,<2", "pypdf>=5,<7", "jsonschema>=4.23,<5", "requests>=2.32,<3", "beautifulsoup4>=4.12,<5"]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[project.scripts]
paper-review = "paper_review.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
